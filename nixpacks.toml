[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x", "openssl"]
aptPkgs = ["build-essential", "libcairo2-dev", "libpango1.0-dev", "libjpeg-dev", "libgif-dev", "librsvg2-dev", "python3"]

[phases.install]
dependsOn = ["setup"]
cmds = ["pnpm i --frozen-lockfile"]
cacheDirectories = ["/root/.local/share/pnpm/store/v3"]
paths = ["/app/node_modules/.bin"]

[phases.build]
dependsOn = ["install"]
cmds = ["pnpm run build"]
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "pnpm run start"
