<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kupon Makan Al Imam</title>
    <!-- Using Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-maroon: #550000;
            --accent-gold: #D4AF37;
            --bg-cream: #FCFAF6;
            --text-dark: #333333;
        }
        
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        .coupon-container {
            width: 800px;
            height: 380px;
            background-color: var(--bg-cream);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            position: relative;
            overflow: hidden;
            /* Subtle texture/pattern for background */
            background-image: radial-gradient(var(--accent-gold) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: 0 0;
        }

        /* Inner white background to make pattern very subtle */
        .coupon-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(252, 250, 246, 0.93);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            width: 100%;
            height: 100%;
            padding: 30px;
            box-sizing: border-box;
        }

        /* LEFT SECTION: LOGO */
        .left-section {
            width: 28%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 2px dashed rgba(85, 0, 0, 0.2);
            padding-right: 25px;
        }

        .left-section img {
            width: 130px;
            height: auto;
            margin-bottom: 20px;
        }

        .logos-wrapper {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .logos-wrapper img {
            width: 75px;
            height: auto;
            margin-bottom: 0;
        }

        .pesantren-name {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-maroon);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.4;
        }
        
        .pesantren-name span {
            color: var(--accent-gold);
        }

        /* MIDDLE SECTION: MAIN INFO */
        .middle-section {
            width: 52%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
        }

        .voucher-subtitle {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-maroon);
            letter-spacing: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .voucher-subtitle::before, .voucher-subtitle::after {
            content: '♦';
            color: var(--accent-gold);
            font-size: 14px;
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 700;
            color: var(--primary-maroon);
            margin: 0 0 30px 0;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(212, 175, 55, 0.2);
        }

        .badge {
            background-color: var(--primary-maroon);
            border: 2px solid var(--accent-gold);
            border-radius: 50px;
            padding: 8px 25px 8px 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(85, 0, 0, 0.2);
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            background-color: var(--bg-cream);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-maroon);
            font-size: 18px;
        }

        .badge-text {
            color: white;
            display: flex;
            flex-direction: column;
        }

        .badge-text .small {
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .badge-text .large {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .badge-text .detail {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
            font-weight: normal;
        }

        /* RIGHT SECTION: GREETING */
        .right-section {
            width: 20%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-left: 20px;
        }

        .cloche-icon {
            font-size: 48px;
            color: rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }

        .greeting {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-maroon);
            line-height: 1.3;
        }

        /* Cutout corners effect */
        .coupon-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            /* Create transparent half-circles on the left and right edges for a coupon look */
            background: 
                radial-gradient(circle at 0 50%, #f0f0f0 15px, transparent 16px),
                radial-gradient(circle at 100% 50%, #f0f0f0 15px, transparent 16px);
            z-index: 5;
        }

        .coupon-footer {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 8px;
            color: rgba(85, 0, 0, 0.6);
            font-style: italic;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="coupon-container">
        <div class="content">
            <!-- Left Section (Logo) -->
            <div class="left-section">
                <div class="logos-wrapper">
                    <!-- Logo Andalus first (or vice versa) -->
                    <img src="../images/logo-andalus.webp" alt="Logo Andalus" onerror="this.src='https://via.placeholder.com/75x75?text=ANDALUS'">
                    <!-- Logo Al Imam -->
                    <img src="../images/logo.png" alt="Logo Al Imam" onerror="this.src='https://via.placeholder.com/75x75?text=ALIMAM'">
                </div>
                <div class="pesantren-name">
                    Pesantren<br>
                    <span>Al Imam Al Islami</span>
                </div>
            </div>

            <!-- Middle Section (Voucher Makan) -->
            <div class="middle-section">
                <div class="voucher-subtitle">VOUCHER</div>
                <h1 class="main-title">MAKAN</h1>
                
                <div class="badge">
                    <div class="icon-circle">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                    <div class="badge-text">
                        <span class="small">Berlaku Untuk</span>
                        <span class="large">3 ORANG</span>
                        <span class="detail">(1 Santri + 2 Pendamping)</span>
                    </div>
                </div>
            </div>

            <!-- Right Section (Greeting) -->
            <div class="right-section">
                <i class="fa-solid fa-bell-concierge cloche-icon"></i>
                <div class="greeting">
                    SELAMAT<br>MENIKMATI
                </div>
            </div>
        </div>

        <div class="coupon-footer">
            * Catatan: Serahkan kupon kepada petugas panitia konsumsi. Kupon hanya berlaku pada hari kedatangan santri.
        </div>
    </div>

</body>
</html>
