<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>PRINT — 45 Voucher Kehadiran Penuh MOSA CUP 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:wght@700;900&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== PRINT SETTINGS ===== */
  @page {
    size: A4 portrait;
    margin: 4mm;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #fff;
  }

  /* ===== PAGE GRID: 3 kolom × 9 baris ===== */
  .page {
    width: 202mm;
    height: 289mm;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 1mm;
    page-break-after: always;
    break-after: page;
  }
  .page:last-child {
    page-break-after: avoid;
    break-after: avoid;
  }

  /* ===== SINGLE VOUCHER ===== */
  /* Each cell: ~67mm wide × ~32mm tall */
  .voucher {
    display: flex;
    width: 100%;
    height: 100%;
    border-radius: 2.5pt;
    overflow: hidden;
    outline: 0.4pt solid rgba(139,0,0,0.35);
    position: relative;
  }

  /* ---- STUB (putih, 24% lebar) ---- */
  .stub {
    width: 24%;
    min-width: 24%;
    /* ~16mm lebar, 32mm tinggi */
    background: linear-gradient(160deg, #fff9e6 0%, #fffdf5 60%, #f5e9c8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    border-right: 0.8pt dashed #c8a44a;
    gap: 1pt;
    overflow: hidden;
  }
  /* Punch holes */
  .stub::before, .stub::after {
    content: '';
    position: absolute;
    width: 4pt; height: 4pt;
    background: white;
    border-radius: 50%;
    left: 100%; transform: translateX(-50%);
    z-index: 5;
    box-shadow: 0 0 0 0.4pt #c8a44a;
  }
  .stub::before { top: -2pt; }
  .stub::after  { bottom: -2pt; }

  /* "VOUCHER" vertikal — font & spacing dihitung agar muat di 32mm */
  .stub-text {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-weight: 900;
    font-size: 5.5pt;      /* 5.5pt × 7 chars ≈ 13mm — muat */
    letter-spacing: 0.5pt;
    text-transform: uppercase;
    background: linear-gradient(180deg, #b8860b, #d4af37, #ffe98a, #d4af37, #8b6914);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    flex-shrink: 0;
  }

  /* Barcode — total lebar < 16mm */
  .stub-bars {
    display: flex;
    gap: 0.7pt;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .stub-bars span {
    background: #2a1a00;
    border-radius: 0.3pt;
    display: block;
  }

  /* Tanggal vertikal */
  .stub-date {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 4pt;        /* 4pt × 10 chars ≈ 13mm */
    font-weight: 700;
    letter-spacing: 0pt;   /* 0 agar tidak melar */
    color: #8b0000;
    flex-shrink: 0;
  }

  /* ---- BODY ---- */
  .vbody {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .bg {
    position: absolute; inset: 0;
    background-image: url('/images/gedung-utama-dan-lapangan-basket.webp');
    background-size: cover;
    background-position: center 40%;
    z-index: 0;
  }
  .overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(135deg,
      rgba(100,0,0,0.93) 0%,
      rgba(70,0,0,0.82) 45%,
      rgba(40,0,0,0.68) 100%
    );
  }
  .gold-line {
    position: absolute; top: 0; left: 0; right: 0;
    height: 1pt; z-index: 4;
    background: linear-gradient(90deg, transparent, #d4af37, #ffe98a, #d4af37, transparent);
  }

  /* Logo row */
  .logo-row {
    position: absolute;
    top: 2.5pt; right: 3pt;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 2pt;
    background: rgba(0,0,0,0.28);
    padding: 1.5pt 3pt;
    border-radius: 2pt;
  }
  .logo-row img {
    height: 11pt;
    object-fit: contain;
    filter: drop-shadow(0 0.5pt 2pt rgba(0,0,0,0.6));
  }
  .logo-sep { width: 0.5pt; height: 8pt; background: rgba(212,175,55,0.5); }
  .logo-txt { line-height: 1.2; }
  .logo-txt .l1 { font-size: 3.5pt; font-weight: 700; color: #f5e4a0; }
  .logo-txt .l2 { font-size: 4.5pt; font-weight: 900; color: #fff; }
  .logo-txt .l3 { font-size: 3pt; color: #d4af37; }

  /* Content */
  .vcontent {
    position: relative; z-index: 10;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2pt 4pt 0 4pt;
  }
  .tag {
    font-size: 3.5pt; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.3pt;
    color: #d4af37;
    background: linear-gradient(135deg, #8b0000, #a00000);
    border: 0.4pt solid rgba(212,175,55,0.5);
    padding: 0.8pt 4pt;
    border-radius: 6pt;
    width: fit-content;
    margin-bottom: 1.5pt;
  }
  .main-title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 11pt;
    text-transform: uppercase;
    line-height: 1;
    background: linear-gradient(180deg, #ffe98a 0%, #d4af37 40%, #f5e4a0 70%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1.5pt;
    letter-spacing: -0.2pt;
  }
  .subtitle {
    display: inline-block;
    padding: 1pt 5pt;
    border-radius: 1.5pt;
    background: linear-gradient(135deg, #d4af37, #f5e4a0, #c8a415);
    color: #3a1f00;
    font-size: 4.5pt; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.3pt;
    margin-bottom: 1.5pt;
    width: fit-content;
  }
  .nominal {
    font-family: 'Cinzel Decorative', cursive;
    font-weight: 700;
    font-size: 9.5pt;
    background: linear-gradient(180deg, #ffe98a 0%, #d4af37 50%, #fff7cc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Footer */
  .vfooter {
    position: relative; z-index: 10;
    padding: 1.5pt 4pt;
    text-align: center;
    font-size: 3.5pt;
    font-weight: 500;
    background: rgba(130,0,0,0.85);
    color: #fce8b2;
    border-top: 0.5pt solid rgba(212,175,55,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Confetti dots */
  .cdot {
    position: absolute; z-index: 3;
    pointer-events: none;
    opacity: 0.4;
  }

  /* ===== SCREEN ONLY ===== */
  @media screen {
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 24px;
    }
    .page {
      background: white;
      box-shadow: 0 12px 50px rgba(0,0,0,0.6);
      padding: 2mm;
    }
    .info-bar {
      background: #2a2a3e;
      border: 1px solid #d4af37;
      border-radius: 10px;
      padding: 14px 24px;
      color: #e0e0e0;
      font-size: 13px;
      line-height: 1.8;
      max-width: 760px;
      text-align: center;
    }
    .info-bar strong { color: #ffe98a; }
    .info-bar code { background:#333; color:#69f0ae; padding:1px 5px; border-radius:3px; font-size:12px; }
    .print-btn {
      margin-top: 10px;
      background: linear-gradient(135deg, #d4af37, #c8a415);
      color: #3a1f00; font-weight: 900;
      font-size: 14px; padding: 10px 28px;
      border: none; border-radius: 8px;
      cursor: pointer; letter-spacing: 1px;
    }
    .print-btn:hover { opacity: 0.88; }
    .page-label {
      color: #d4af37; font-size: 12px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      text-align: center;
    }
  }

  @media print {
    .info-bar, .page-label, .print-btn { display: none; }
    body { background: white; }
  }
</style>
</head>
<body>

<div class="info-bar">
  <strong>📋 Panduan Cetak 45 Voucher (3×9 per lembar)</strong><br>
  Tekan <strong>Ctrl+P</strong> → Kertas: <strong>A4</strong> · Orientasi: <strong>Portrait</strong> ·
  Margin: <strong>None</strong> · Scale: <strong>100%</strong> ·
  <strong>✅ Centang "Background graphics/colors"</strong><br>
  <em>Lembar 1: 27 voucher · Lembar 2: 18 voucher · Total: 45 voucher</em><br>
  <button class="print-btn" onclick="window.print()">🖨️ Cetak Sekarang</button>
</div>

<div class="page-label">— Lembar 1 · 27 Voucher —</div>
<div class="page" id="page1"></div>

<div class="page-label">— Lembar 2 · 18 Voucher —</div>
<div class="page" id="page2"></div>

<script>
// Barcode bars: lebar total harus < 12mm (stub 16mm - padding)
// [lebar px, tinggi px] — dikecilkan untuk ukuran print kecil
const BW = [1,2,1,2,1,1,2,1,2,1,1,2,1,2,1,1,2,1]; // bar widths
const BH = [8,6,10,5,8, 7,5,10,6,8, 6,9,5,7,9,6,8,5];  // bar heights

const CONF = ['#ffe98a','#d4af37','#f5e4a0','#ffd700','#c8a415'];

function createVoucher() {
  const v = document.createElement('div');
  v.className = 'voucher';

  // --- STUB ---
  const stub = document.createElement('div');
  stub.className = 'stub';

  const st = document.createElement('div');
  st.className = 'stub-text';
  st.textContent = 'VOUCHER';
  stub.appendChild(st);

  const bars = document.createElement('div');
  bars.className = 'stub-bars';
  BW.forEach((w, i) => {
    const b = document.createElement('span');
    b.style.cssText = `width:${w}pt;height:${BH[i]}pt;`;
    bars.appendChild(b);
  });
  stub.appendChild(bars);

  const date = document.createElement('div');
  date.className = 'stub-date';
  date.textContent = '24.07.2026';
  stub.appendChild(date);

  v.appendChild(stub);

  // --- BODY ---
  const body = document.createElement('div');
  body.className = 'vbody';

  // Confetti dots (few, small)
  CONF.forEach((c, ci) => {
    const d = document.createElement('div');
    d.className = 'cdot';
    const s = (Math.random() * 3 + 2).toFixed(1);
    d.style.cssText = `
      width:${s}pt; height:${(s*0.4).toFixed(1)}pt;
      background:${c};
      left:${(Math.random()*75+10).toFixed(0)}%;
      top:${(Math.random()*65+10).toFixed(0)}%;
      transform:rotate(${(Math.random()*360).toFixed(0)}deg);
      border-radius:${Math.random()>.5?'50%':'1pt'};
    `;
    body.appendChild(d);
  });

  body.innerHTML += `
    <div class="bg"></div>
    <div class="overlay"></div>
    <div class="gold-line"></div>
    <div class="logo-row">
      <img src="logo-alimam.png" alt="">
      <div class="logo-sep"></div>
      <img src="logo-andalus.png" alt="">
      <div class="logo-sep"></div>
      <div class="logo-txt">
        <div class="l1">Pesantren</div>
        <div class="l2">Al Imam Al Islami</div>
        <div class="l3">Managed by Al Andalus IIBS</div>
      </div>
    </div>
    <div class="vcontent">
      <div class="tag">🌟 Reward Kehadiran Penuh — MOSA CUP 2026</div>
      <div class="main-title">VOUCHER JAJAN</div>
      <div class="subtitle">PAAS Mart & Kantin Al Imam</div>
      <div class="nominal">Rp 6.000</div>
    </div>
    <div class="vfooter">Berlaku 1× penukaran di PAAS Mart & Kantin Al Imam · Tidak dapat diuangkan</div>
  `;

  v.appendChild(body);
  return v;
}

const p1 = document.getElementById('page1');
const p2 = document.getElementById('page2');
for(let i=0; i<27; i++) p1.appendChild(createVoucher());
for(let i=0; i<18; i++) p2.appendChild(createVoucher());
</script>
</body>
</html>
